// ─── 尺寸與 SVG 初始化 ──────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const svg = d3.select('#svg')
  .attr('width', W).attr('height', H);

const g = svg.append('g')
  .attr('transform', `translate(${W/2},${H/2})`);

const zoom = d3.zoom()
  .scaleExtent([0.2, 3])
  .on('zoom', e => g.attr('transform', e.transform.translate(W/2, H/2)));
svg.call(zoom);

// ─── 顏色與佈局 ─────────────────────────────────────────────────────────────
const BRANCH_COLORS = ['#4a9eff','#ff6b6b','#ffd93d','#6bcb77','#c77dff','#ff9f43'];
const ROOT_COLOR = '#a0b8d0';

// 計算節點半徑
function nodeR(d) {
  if (d.data.type === 'root') return 42;
  if (d.data.type === 'branch') return 28;
  if (['stat','time','place','keyword','summary','chart'].includes(d.data.type)) return 20;
  return 14;
}

// 取得顏色
function nodeColor(d) {
  if (d.data.type === 'root') return ROOT_COLOR;
  return d.data.color || '#888';
}

// ─── 建立層次結構 ───────────────────────────────────────────────────────────
const root = d3.hierarchy(DATA);
root.x0 = 0; root.y0 = 0;

// 初始只展開一層
root.children.forEach(collapse);
function collapse(d) {
  if (d.children) {
    d._children = d.children;
    d._children.forEach(collapse);
    d.children = null;
  }
}

// ─── 徑向佈局 ───────────────────────────────────────────────────────────────
const treeLayout = d3.tree()
  .size([2 * Math.PI, 320])
  .separation((a, b) => (a.parent === b.parent ? 1.2 : 2.2) / a.depth);

let linkSel, nodeSel;

function radialPoint(x, y) {
  return [(y = +y) * Math.cos(x -= Math.PI / 2), y * Math.sin(x)];
}

// ─── 更新函數 ───────────────────────────────────────────────────────────────
function update(source) {
  const treeData = treeLayout(root);
  const nodes = treeData.descendants();
  const links = treeData.links();

  // 調整半徑距離
  nodes.forEach(d => {
    if (d.depth === 0) d.y = 0;
    else if (d.depth === 1) d.y = 140;
    else if (d.depth === 2) d.y = 260;
    else d.y = 360;
  });

  // ── 連結 ──
  const link = g.selectAll('.link').data(links, d => d.target.data.name);
  const linkEnter = link.enter().append('path').attr('class', 'link');
  const linkUpdate = linkEnter.merge(link);

  linkUpdate.transition().duration(400)
    .attr('d', d3.linkRadial().angle(d => d.x).radius(d => d.y))
    .attr('stroke', d => d.target.data.color || '#4a4a5a')
    .attr('stroke-opacity', 0.35);

  link.exit().remove();

  // ── 節點 ──
  const node = g.selectAll('.node').data(nodes, d => d.data.name);
  const nodeEnter = node.enter().append('g')
    .attr('class', 'node')
    .attr('transform', d => `translate(${radialPoint(source.x || 0, source.y || 0)})`)
    .on('click', clicked)
    .on('mouseover', showTooltip)
    .on('mouseout', hideTooltip);

  nodeEnter.append('circle')
    .attr('r', 0)
    .attr('fill', d => nodeColor(d))
    .attr('fill-opacity', d => d.data.type === 'root' ? 0.25 : 0.18)
    .attr('stroke', d => nodeColor(d))
    .attr('stroke-width', d => d.data.type === 'root' ? 2.5 : 1.8)
    .attr('stroke-opacity', 0.8);

  nodeEnter.append('text')
    .attr('dy', '0.31em')
    .style('font-size', d => d.data.type === 'root' ? '12px' : d.data.type === 'branch' ? '11px' : '10px')
    .style('fill', d => nodeColor(d))
    .style('font-weight', d => ['root','branch'].includes(d.data.type) ? '600' : '400')
    .style('text-anchor', 'middle');

  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(400)
    .attr('transform', d => `translate(${radialPoint(d.x, d.y)})`);

  nodeUpdate.select('circle').transition().duration(400)
    .attr('r', d => nodeR(d));

  nodeUpdate.select('text')
    .text(d => {
      const n = d.data.name;
      if (d.data.type === 'root') return n;
      return n.length > 8 ? n.slice(0,8)+'…' : n;
    })
    .attr('x', d => {
      if (d.depth === 0) return 0;
      const [px] = radialPoint(d.x, d.y);
      return px > 0 ? nodeR(d) + 5 : -nodeR(d) - 5;
    })
    .attr('text-anchor', d => {
      if (d.depth === 0) return 'middle';
      const [px] = radialPoint(d.x, d.y);
      return px > 0 ? 'start' : 'end';
    })
    .attr('dy', '0.35em');

  // ── 有子節點時顯示折疊指示 ──
  nodeUpdate.select('.collapse-indicator').remove();
  nodeUpdate.filter(d => d._children)
    .append('text')
    .attr('class','collapse-indicator')
    .text('+')
    .style('font-size','13px')
    .style('fill', d => nodeColor(d))
    .style('font-weight','700')
    .attr('dy','0.35em')
    .style('pointer-events','none');

  node.exit().transition().duration(300)
    .attr('transform', d => `translate(${radialPoint(source.x, source.y)})`)
    .remove();
}

// ─── 互動 ───────────────────────────────────────────────────────────────────
function clicked(event, d) {
  if (d.children) {
    d._children = d.children;
    d.children = null;
  } else {
    d.children = d._children;
    d._children = null;
  }
  update(d);
}

function expandAll() {
  root.descendants().forEach(d => {
    if (d._children) { d.children = d._children; d._children = null; }
  });
  update(root);
}

function collapseAll() {
  root.children && root.children.forEach(collapse);
  update(root);
}

function resetZoom() {
  svg.transition().duration(400)
    .call(zoom.transform, d3.zoomIdentity);
}

// ─── Tooltip ────────────────────────────────────────────────────────────────
const tt = document.getElementById('tooltip');

function showTooltip(event, d) {
  if (!d.data.info && !d.data.chartType) return;
  let html = `<div class="tt-title">${d.data.icon || ''} ${d.data.name}</div>`;

  if (d.data.chartType === 'bar' && d.data.chartData) {
    const max = Math.max(...d.data.chartData);
    html += `<div style="margin-top:8px">`;
    d.data.chartLabels.forEach((lb, i) => {
      const pct = (d.data.chartData[i] / max * 100).toFixed(0);
      const color = d.data.color || '#4a9eff';
      html += `<div style="display:flex;align-items:center;gap:6px;margin:3px 0">
        <span style="width:48px;font-size:10px;color:#7a8a9a;flex-shrink:0">${lb}</span>
        <div style="flex:1;height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${color};opacity:0.75;border-radius:4px"></div>
        </div>
        <span style="font-size:10px;color:#9aabb8;width:28px;text-align:right">${d.data.chartData[i]}</span>
      </div>`;
    });
    html += `</div>`;
  } else if (d.data.chartType === 'pie' || d.data.chartType === 'ring') {
    const total = d.data.chartData.reduce((a,b)=>a+b,0);
    const colors = ['#4a9eff','#ffd93d','#6bcb77','#ff6b6b','#c77dff'];
    html += `<div style="margin-top:8px">`;
    d.data.chartLabels.forEach((lb, i) => {
      const pct = (d.data.chartData[i]/total*100).toFixed(1);
      html += `<div style="display:flex;align-items:center;gap:6px;margin:3px 0">
        <div style="width:8px;height:8px;border-radius:50%;background:${colors[i]};flex-shrink:0"></div>
        <span style="font-size:11px;color:#c8d0dc;flex:1">${lb}</span>
        <span style="font-size:11px;color:#9aabb8">${pct}%</span>
      </div>`;
    });
    html += `</div>`;
  }

  if (d.data.info) {
    html += `<div style="margin-top:8px;border-top:1px solid rgba(255,255,255,0.07);padding-top:8px;white-space:pre-wrap;font-size:11px;color:#9aabb8">${d.data.info}</div>`;
  }

  tt.innerHTML = html;
  tt.style.display = 'block';
  positionTooltip(event);
}

function positionTooltip(event) {
  const x = event.clientX + 14, y = event.clientY - 10;
  const tw = 280, th = tt.offsetHeight;
  tt.style.left = (x + tw > window.innerWidth ? x - tw - 28 : x) + 'px';
  tt.style.top  = (y + th > window.innerHeight ? y - th : y) + 'px';
}

function hideTooltip() {
  tt.style.display = 'none';
}

svg.on('mousemove', e => {
  if (tt.style.display !== 'none') positionTooltip(e);
});

// ─── 初始渲染 ────────────────────────────────────────────────────────────────
update(root);

// 稍後展開一層
setTimeout(() => {
  root.children && root.children.forEach(d => {
    // 保持只展一層
  });
}, 300);

window.addEventListener('resize', () => {
  const nw = window.innerWidth, nh = window.innerHeight;
  svg.attr('width', nw).attr('height', nh);
});
</script>
</body>
</html>
