<style>

  a.btn {

    background: #4a9eff;
    color: #0f1117;
    padding: 12px 32px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s;
  }
  a.btn:hover { background: #6ab3ff; }
  .notice {
    font-size: 11px;
    color: #4a5a6a;
    text-align: center;
    max-width: 420px;
  }
